name: holiday-calendar-v28
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-holiday_calendar}
      POSTGRES_USER: ${POSTGRES_USER:-holiday_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - holiday-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  web-service:
    build:
      context: ./web-service
    restart: unless-stopped
    networks:
      - holiday-network
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-holiday_calendar}
      DB_USER: ${POSTGRES_USER:-holiday_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_password_change_me}
      HOLIDAY_SERVICE_URL: http://web-service:8001
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - holiday-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    networks:
      - holiday-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  holiday-network:
    driver: bridge
